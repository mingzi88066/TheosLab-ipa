name: TheosLab
options:
  deploymentTarget:
    iOS: "15.0"
packages:
  IshEmbed:
    url: https://github.com/Lolendor/ish-arm64-pkg
    exactVersion: 0.3.3
targets:
  TheosLab:
    type: application
    platform: iOS
    info:
      path: Generated/AppInfo.plist
      properties:
        CFBundleDisplayName: Theos Lab
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        CFBundleDocumentTypes:
          - CFBundleTypeName: Folder
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes:
              - public.folder
    sources:
      - App
      - Resources
      - path: LICENSE
        buildPhase: resources
      - path: THIRD_PARTY.md
        buildPhase: resources
      - path: ALPINE-PACKAGES.tsv
        buildPhase: resources
      - path: Generated/Guest
        type: folder
    dependencies:
      - package: IshEmbed
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: local.theoslab.workspace
        ARCHS: arm64
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Theos Lab
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        MARKETING_VERSION: "2.8.8"
        CURRENT_PROJECT_VERSION: "9"
        CODE_SIGN_STYLE: Automatic
